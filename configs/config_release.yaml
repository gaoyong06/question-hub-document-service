# 线上环境配置
# config_release.yaml
# 注意：此项目使用环境变量配置，此文件仅作为配置参考
# 实际配置请使用 .env.release 文件或环境变量

# 服务配置（app_id 为本服务身份，调用 asset_service 时携带 X-App-Id）
service:
  name: question-hub-document-service
  version: 1.0.0
  app_id: "00000000-0000-0000-0000-000000000002"  # 与 question-hub 的 APP_ID 一致

# RocketMQ配置（仅消费 document.convert 任务，结果通过 HTTP API 提交，不再发送 MQ）
rocketmq:
  name_server: rocketmq:9876
  topic: question_hub_events
  consumer_group: question_hub_document_consumer
  consume_tag: document.convert

# 文件下载配置
download:
  timeout: 300  # 5分钟
  chunk_size: 8192
  temp_file_dir: /var/lib/question-hub-document-service/tmp

# 日志配置
log:
  level: INFO
  format: json
  file_path: /var/log/question-hub-document-service/question-hub-document-service.log
  to_file: true

# 题目识别配置
document:
  max_file_size: 52428800  # 50MB
  supported_extensions:
    - .docx
    - .doc
    - .pdf
    - .ppt
    - .pptx
    - .xls
    - .xlsx
    - .jpg
    - .jpeg
    - .png
    - .gif
    - .bmp
    - .txt
    - .html
    - .csv
    - .json
    - .xml
    - .epub

# Asset Service 配置（调用时使用 service.app_id 作为 X-App-Id；与 question_hub_service 一致使用 api_base_url）
asset_service:
  api_base_url: http://asset-service:8104  # 内网调用上传接口

# Question Hub Service 配置（提交转换结果用；须为容器内可访问的地址）
question_hub_service:
  api_base_url: http://question-hub-service:8112

# OCR配置（可选）
ocr:
  enabled: true
  azure_docintel_endpoint: ""
  azure_docintel_key: ""

